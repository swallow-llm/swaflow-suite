# truncated at document boundaries (max_tokens_per_file). No random selection.
#
# Revision pinned to commit sha: 689a3ea2d8217e64d73a5058913fa43ad15e81aa
# Total quota: 1.000B tokens (before held-out)

[build]
name = "dolma3_1b_val"
