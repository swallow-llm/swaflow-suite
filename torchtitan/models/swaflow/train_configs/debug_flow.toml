# Installation check: a 2-layer flow model (flavor "debugmodel") trained for 100 steps on the c4_test sample bundled with torchtitan.
# Launch: torchrun --standalone --nproc_per_node <G> -m torchtitan.models.swaflow.train --job.config_file torchtitan/models/swaflow/train_configs/debug_flow.toml

[job]
dump_folder = "./outputs"
description = "SwaFlow installation check (2-layer flow model)"
print_config = false
custom_config_module = "torchtitan.models.swaflow.job_config"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 10
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 1
disable_color_printing = false
enable_tensorboard = false
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "swaflow"
flavor = "debugmodel"
hf_assets_path = "./tests/assets/tokenizer"

[optimizer]
name = "AdamW"
lr = 8e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 10
decay_ratio = 0.8
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 8
seq_len = 2048
max_norm = 1.0
steps = 100
dataset = "c4_test"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 100
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"

[activation_checkpoint]
mode = "none"

[compile]
enable = false
components = ["model", "loss"]

[validation]
enable = false

# Short intervals so the diagnostics are exercised within 100 steps.
[swaflow.diagnostics]
attn_stats_every = 25
attn_stats_query_stride = 4
grad_norm_every_step = true
