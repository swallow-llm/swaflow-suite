# SwaFlow SFT for the AR twins (150M / 500M / 1B): the same Dolci Instruct epoch and recipe as sft_dolci_flow.toml,
# with the standard AR loss on response tokens only. Values below are for 150M.
# Per size, set --model.flavor, --optimizer.lr (1/10 of pretraining: 6e-5 / 3e-5 / 3e-5) and
# --checkpoint.initial_load_path <AR twin dump>/checkpoint/step-238400 (2T).
# Launch: torchrun --nnodes <N> --nproc_per_node 8 -m torchtitan.models.swaflow.ar.train --job.config_file <this file> --job.dump_folder $SWAFLOW_OUTPUTS/sft_ar_150m
# Also override the tokenizer and data paths as in sft_dolci_flow.toml.

[job]
dump_folder = "./outputs"
description = "SwaFlow AR-twin SFT on Dolci Instruct (response-only loss)"
print_config = false
custom_config_module = "torchtitan.models.swaflow.job_config"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100000
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 10
disable_color_printing = true
enable_tensorboard = true
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "swaflow_ar"
flavor = "150M"
hf_assets_path = "./assets/hf/SmolLM2-135M"

[optimizer]
name = "AdamW"
lr = 6e-5                          # 1/10 of the pretraining LR
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
# Short warmup (steps / 20), then linear decay to 0 over the last 90%.
warmup_steps = 55
total_steps = 1107
decay_ratio = 0.9
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 8
global_batch_size = 512            # 512 x 2048 = 1,048,576 tokens/step
seq_len = 2048                     # must match the SFT build
max_norm = 2.5
steps = 1107                       # one epoch: n_train_blocks // 512 of the SFT build
dataset = "sft_ar"                 # same blocks and loss mask as "sft"
dataset_path = "./data/dolci_sft_2048"

[debug]
seed = 20260902

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1

[activation_checkpoint]
mode = "none"                      # same choice as pretraining (selective for 1B)
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[checkpoint]
enable = true
folder = "checkpoint"
initial_load_path = ""             # set to the base checkpoint (see header)
initial_load_model_only = true     # weights only; fresh optimizer state
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"
interval = 0                       # unused: [swaflow.checkpoint_schedule] decides

[validation]
enable = true
freq = 1000000                     # unused: validation runs at every checkpoint

# --------------------------------------------------------------------------
# SwaFlow extensions (no [swaflow.model]: the AR model has no alpha window)
# --------------------------------------------------------------------------

[swaflow.rng]
rank_distinct_seed = true
checkpoint_rng_state = true

[swaflow.checkpoint_schedule]
# Weights-only snapshots every 400M tokens; the final step is a full state.
enable = true
log_spaced_until = 0
interval_tokens = 400_000_000
full_state_every_tokens = 0
snapshot_folder = "snapshots"

[swaflow.eval]
# Held-out loss on the pretraining validation split, to check that SFT does not degrade it.
enable = true
build_dir = "./data/production_6t"
local_batch_size = 8
alpha_grid = []                    # no alpha axis: plain next-token CE
max_blocks_per_source = 2048
seed = 1234
embed_geometry = 1024

[swaflow.diagnostics]
attn_stats_every = 0
grad_norm_every_step = true

[swaflow.watchdog]
# Logging only: the stop rules are calibrated for pretraining.
enable = true
grace_steps = 50
stop_enable_after_steps = 1000000
spike_skip = false
stop_clip_rate = 0.0
alpha_contrast_min = 0.0
