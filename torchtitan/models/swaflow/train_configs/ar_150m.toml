# SwaFlow autoregressive twin, 150M: next-token prediction for 0 -> 2T tokens with the same data, order,
# batch, LR schedule and backbone shape as flow_150m.toml (causal attention, no time conditioning).
# Launch: torchrun --nnodes <N> --nproc_per_node 8 -m torchtitan.models.swaflow.ar.train --job.config_file <this file> --job.dump_folder $SWAFLOW_OUTPUTS/ar_150m
# The ar.train entry point registers the "swaflow_ar" model. Override the tokenizer and data
# paths as in flow_150m.toml. Any GPU count gives the same global batch; a resume must keep the GPU count.

[job]
dump_folder = "./outputs"
description = "SwaFlow AR twin 150M, 0-2T tokens of Dolma 3 Mix (next-token CE, LR 6e-4)"
print_config = false
custom_config_module = "torchtitan.models.swaflow.job_config"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100000
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 10                         # also the watchdog's check interval
disable_color_printing = true
enable_tensorboard = true
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "swaflow_ar"
flavor = "150M"                       # same shape as the 150M flow model; QK-norm on by default
hf_assets_path = "./assets/hf/SmolLM2-135M"

[optimizer]
name = "AdamW"
lr = 6e-4                             # same as the 150M flow model
# Betas and weight decay are the torchtitan defaults (not tuned).
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
# Same as the flow ladder. total_steps spans the whole data plan, so a 2T run never
# reaches the decay phase: the LR is constant after warmup.
warmup_steps = 2000
total_steps = 715255
decay_ratio = 0.1
decay_type = "linear"
min_lr_factor = 0.1

[training]
local_batch_size = 16                 # 256 GPUs x 16 = 4096 sequences: no gradient accumulation
global_batch_size = 4096              # 8,388,608 tokens/step: step N reads the same samples as the flow run
seq_len = 2048                        # must match the data build
max_norm = 2.5
steps = 238418                        # 2.0T tokens
dataset = "indexed"
dataset_path = "./data/production_6t"

[debug]
seed = 20260810                       # same as the flow ladder

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1

[activation_checkpoint]
mode = "none"                         # same choice as the flow model of this size
selective_ac_option = "op"

[compile]
enable = false                        # must stay off while attn_stats_every > 0
components = ["model", "loss"]

[checkpoint]
enable = true
folder = "checkpoint"                 # full training states (the resume path)
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"
interval = 0                          # unused: [swaflow.checkpoint_schedule] decides

[validation]
enable = true
freq = 1000000                        # unused: validation runs at every checkpoint

# --------------------------------------------------------------------------
# SwaFlow extensions (no [swaflow.model]: the AR model has no alpha window)
# --------------------------------------------------------------------------

[swaflow.rng]
rank_distinct_seed = true
checkpoint_rng_state = true

[swaflow.checkpoint_schedule]
# Weights-only snapshots at steps 1, 2, 4, ..., 512 and a full training state
# every 20B tokens, as in the flow ladder.
enable = true
log_spaced_until = 512
interval_tokens = 20_000_000_000
full_state_every_tokens = 20_000_000_000
snapshot_folder = "snapshots"

[swaflow.eval]
enable = true
build_dir = "./data/production_6t"
local_batch_size = 16
alpha_grid = []                       # no alpha axis: validation reports plain next-token CE
max_blocks_per_source = 2048
seed = 1234
embed_geometry = 1024

[swaflow.diagnostics]
attn_stats_every = 50
attn_stats_query_stride = 16
grad_norm_every_step = true

[swaflow.watchdog]
# Stops only on non-finite gradient norms or a high spike rate; the clip-rate rule
# needs an alpha profile, which the AR model does not have.
enable = true
grace_steps = 3000
stop_enable_after_steps = 6000
spike_skip = false
stop_after_nonfinite = 3
stop_spike_rate = 0.3
stop_clip_rate = 0.0                  # disables the clip-rate / alpha-contrast rule
alpha_contrast_min = 0.0
