# SwaFlow task-specific SFT on TinyGSM (the GSM8K-style Python programs), flow bases of every size.
# 65B tokens (61,988 steps of 2048 x 512 tokens) at LR 3e-4; the build pads each example to 512 tokens.
# Checkpoints at 20B / 40B / 65B: run with --training.steps 19073, then rerun the same command with
# --training.steps 38146 and finally without it; the LR schedule always spans the full 61,988 steps.
# Per size, set --model.flavor, --swaflow.model.schedule_alpha_max, --swaflow.eval.alpha_grid and
# --activation_checkpoint.mode (scripts/launch/sizes.sh), and --checkpoint.initial_load_path to the base
# (a clean-prefix mid-training state; leave it empty to train from scratch).
# Launch: scripts/launch/train.sh <this file> <run_name> [overrides ...]

[job]
dump_folder = "./outputs"
description = "SwaFlow flow SFT on TinyGSM (clean prompt, noised response)"
print_config = false
custom_config_module = "torchtitan.models.swaflow.job_config"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100000
enable_memory_snapshot = false
save_memory_snapshot_folder = "memory_snapshot"

[metrics]
log_freq = 10
disable_color_printing = true
enable_tensorboard = true
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "swaflow"
flavor = "150M"
hf_assets_path = "./assets/hf/SmolLM2-135M"

[optimizer]
name = "AdamW"
lr = 3e-4
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
# Short warmup (total_steps / 20), then linear decay to 0 over the last 90%.
warmup_steps = 3099
total_steps = 61988
decay_ratio = 0.9
decay_type = "linear"
min_lr_factor = 0.0

[training]
local_batch_size = 8
global_batch_size = 2048           # 2048 x 512 = 1,048,576 tokens/step
seq_len = 512                      # must match the SFT build
max_norm = 2.5
steps = 61988                      # 65B tokens, several passes over the build
dataset = "sft"
dataset_path = "./data/tinygsm_pad512"

[debug]
seed = 20260902

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
enable_async_tensor_parallel = false
pipeline_parallel_degree = 1
context_parallel_degree = 1

[activation_checkpoint]
mode = "none"                      # same choice as pretraining (selective for 1B)
selective_ac_option = "op"

[compile]
enable = false
components = ["model", "loss"]

[checkpoint]
enable = true
folder = "checkpoint"
initial_load_path = ""             # set to the base checkpoint (see header)
initial_load_model_only = true     # weights only; fresh optimizer state
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"
interval = 0                       # unused: [swaflow.checkpoint_schedule] decides

[validation]
enable = false
freq = 1000000                     # unused: validation runs at every checkpoint

# --------------------------------------------------------------------------
# SwaFlow extensions
# --------------------------------------------------------------------------

[swaflow.model]
schedule_alpha_max = 0.15          # same window as the base
antithetic_t_sampling = true

[swaflow.rng]
rank_distinct_seed = true
checkpoint_rng_state = true

[swaflow.checkpoint_schedule]
# Only the final step of each segment is saved (as a full state).
enable = true
log_spaced_until = 0
interval_tokens = 100_000_000_000
full_state_every_tokens = 0
snapshot_folder = "snapshots"

[swaflow.eval]
# Disabled for TinyGSM; the alpha grid still sets the size's training grid.
enable = false
build_dir = "./data/production_6t"
local_batch_size = 8
alpha_grid = [0.01875, 0.0375, 0.05625, 0.075, 0.09375, 0.1125, 0.13125, 0.15]
max_blocks_per_source = 2048
seed = 1234
embed_geometry = 1024

[swaflow.diagnostics]
attn_stats_every = 0
grad_norm_every_step = true

[swaflow.watchdog]
# Logging only: the stop rules are calibrated for pretraining.
enable = true
grace_steps = 50
stop_enable_after_steps = 1000000
spike_skip = false
alpha_contrast_min = 0.0


[swaflow.sft]
allow_multiple_epochs = true       # 65B tokens is about 10.7 passes over the build
